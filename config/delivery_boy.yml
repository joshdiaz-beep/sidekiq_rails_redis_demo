# These config values will be shared by all environments but can be overridden.
common: &common
  client_id: "user_signup_demo"

development:
  <<: *common
  brokers:
    - <%= ENV.fetch("KAFKA_BROKERS", "localhost:9092") %>
  client_id: user_signup_demo_delivery_boy

test:
  <<: *common
  brokers:
    - <%= ENV.fetch("KAFKA_BROKERS", "localhost:9092") %>
  client_id: user_signup_demo_delivery_boy_test

production:
  <<: *common
  brokers:
    - kafka1.myapp.com:9092
    - kafka2.myapp.com:9092
    - kafka3.myapp.com:9092
